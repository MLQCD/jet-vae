# Defaults of code_training/train_betavae.py, written out. Usage:
#   python code_training/train_betavae.py --config configs/betavae_default.yaml --cache-dir <cache> --output <file.pth>
# Command-line flags override this file.
epochs: 200
batch-size: 64
lr: 1.0e-3
patience: 20
latent-dim: 128
hidden-dims: [32, 64, 128, 256, 512]

# KL term: H = beta-VAE, A = beta annealing, B = capacity annealing (default)
loss-type: B
beta: 1.0
beta-start: 0.0
beta-anneal-iter: 100000
beta-anneal-schedule: linear     # linear | log_linear
gamma: 1000.0
max-capacity: 25.0
cap-max-iter: 100000

# Reconstruction term
recon-loss-type: mse             # mse | l1 | sqrt_mse | log_mse
recon-loss-weight: 1.0
recon-log-x0: 1.0e-3
n-generate: 64
