[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jet-vae"
version = "0.1.0"
description = "Transformer VAE with a Sinkhorn-EMD loss for particle jets (z, eta, phi point sets), plus a CNN VAE"
requires-python = ">=3.9"
dependencies = ["torch", "numpy", "scikit-learn", "pyyaml"]

[tool.setuptools.packages.find]
include = ["transformer_vae*"]
